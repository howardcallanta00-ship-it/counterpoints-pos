services:
  - type: web
    name: counterpoint-pos
    runtime: docker
    plan: free
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: CI_ENVIRONMENT
        value: production
      - key: APP_BASE_URL
        sync: false
      - key: APP_KEY
        generateValue: true
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "3306"
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_DRIVER
        value: MySQLi
      - key: AVATAR_UPLOAD_PATH
        value: /var/www/html/public/uploads/avatars
      - key: AVATAR_STORAGE_DRIVER
        value: database
      - key: RUN_MIGRATIONS_ON_START
        value: "true"
      - key: SEED_ADMIN_PASSWORD
        sync: false
